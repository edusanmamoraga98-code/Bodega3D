<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Plano 3D - Problemática Bodega</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#e9eef2}
#info{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.9);padding:10px;border-radius:8px;font-family:Arial}
</style>
</head>
<body>
<div id="info">
<b>Plano 3D Conceptual – Bodega (Problemática actual)</b><br>
Arrastra para rotar • Rueda para zoom
</div>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.165.0/build/three.module.js';
import {OrbitControls} from 'https://unpkg.com/three@0.165.0/examples/jsm/controls/OrbitControls.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xe9eef2);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,100);
camera.position.set(6,5,7);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;

scene.add(new THREE.HemisphereLight(0xffffff,0x888888,1.3));
const dl=new THREE.DirectionalLight(0xffffff,1);
dl.position.set(5,8,3);
scene.add(dl);

const floor=new THREE.Mesh(
 new THREE.BoxGeometry(4,0.08,3),
 new THREE.MeshStandardMaterial({color:0xcfcfcf})
);
scene.add(floor);

const wallMat=new THREE.MeshStandardMaterial({color:0xf5f5f5});
function wall(x,z,w,d){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,1.4,d),wallMat);
 m.position.set(x,0.7,z);
 scene.add(m);
}
wall(0,-1.5,4,0.08);
wall(0,1.5,4,0.08);
wall(-2,0,0.08,3);
wall(2,0,0.08,1.2);
wall(2,-1.1,0.08,0.8); // deja espacio puerta

const shelfMat=new THREE.MeshStandardMaterial({color:0x9c6b30});
function shelf(x,z){
 const s=new THREE.Mesh(new THREE.BoxGeometry(0.6,1.2,2.2),shelfMat);
 s.position.set(x,0.6,z);
 scene.add(s);
}
shelf(-1.2,0);
shelf(-0.3,0);
shelf(0.6,0);
shelf(1.5,0);

const door=new THREE.Line(
 new THREE.BufferGeometry().setFromPoints([
   new THREE.Vector3(2,0.01,0.3),
   new THREE.Vector3(2,0.01,1.5)
 ]),
 new THREE.LineBasicMaterial({color:0x0066ff})
);
scene.add(door);

function animate(){
 requestAnimationFrame(animate);
 controls.update();
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
